<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruthLens AI</title>
<link rel="stylesheet" href="style.css">
    <style>
        :root {
            --ink: #0D101C;
            --panel: #161A2C;
            --panel-2: #1D2238;
            --border: #2A2F47;
            --brass: #C89B3C;
            --brass-bright: #E8C468;
            --text: #EDEEF3;
            --muted: #8A8FA3;
            --true: #4ADE80;
            --false: #F87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 420px;
            min-height: 200px;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: var(--ink);
            color: var(--text);
        }

        .app {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
        }

        .header {
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: 21px;
        }

        .ai-tag {
            margin-left: 5px;
            padding: 2px 5px;
            border-radius: 4px;
            background: var(--brass);
            color: var(--ink);
            font-size: 11px;
        }

        .tagline {
            margin: 5px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        #captureBtn {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--brass);
            border-radius: 10px;
            background: transparent;
            color: var(--brass-bright);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        #captureBtn:hover {
            background: rgba(200, 155, 60, 0.10);
        }

        #captureBtn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            margin-top: 14px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        #result {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            font-size: 13px;
            line-height: 1.5;
        }

        .claim,
        .truth-score,
        .explanation {
            margin-bottom: 12px;
        }

        .claim p,
        .truth-score p,
        .explanation p {
            margin: 4px 0 0;
        }

        .error {
            color: var(--false);
        }
    </style>
</head>

<body>
    <div class="app">

        <div class="header">
            <h1>TruthLens <span class="ai-tag">AI</span></h1>
             

            <p class="tagline">Focus on the claim. Verify the facts.</p>
        </div>

        <button id="captureBtn" type="button">
             Capture Current Tab
        </button>

        <div id="status"></div>

        <div id="result"></div>

        <!-- History button -->
        <button id="historyBtn" class="history-btn" type="button">
            History
        </button>
 
        <!-- History results -->
        <div id="history"></div>

    </div> -->

    <!-- Load JavaScript only once, after ALL HTML elements exist -->
    <script src="lens.js"></script>

</body>
</html>
